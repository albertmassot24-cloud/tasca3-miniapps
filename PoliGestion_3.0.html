:root{
 --sport-basketball:#F59E0B;

 --finance-expense:#DC2626;

 --green:var(--finance-income);

}
.card{border:1px solid #e2e8f0;box-shadow:0 3px 14px rgba(21,42,62,.045)}
.btn{transition:background .15s ease,border-color .15s ease,transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.sidebar .nav-btn.active,.sidebar button.active{box-shadow:inset 3px 0 #38bdf8}
.calendar-item{border-left:4px solid var(--sport-neutral,#64748b);padding-left:12px}
.calendar-item[data-sport="Baloncesto"]{--sport-neutral:var(--sport-basketball)}
.calendar-item[data-sport="Voleibol"]{--sport-neutral:var(--sport-volleyball)}
.calendar-item[data-sport="Fútbol sala"]{--sport-neutral:var(--sport-futsal)}
.calendar-item[data-sport="Balonmano"]{--sport-neutral:var(--sport-handball)}
.sport-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.sport-key{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:11px;font-weight:650}
.sport-swatch{width:9px;height:9px;border-radius:50%;display:inline-block}
.finance-income{color:var(--finance-income)!important}
.finance-expense{color:var(--finance-expense)!important}
.finance-tax{color:var(--finance-tax)!important}
.finance-neutral{color:var(--finance-neutral)!important}
.badge.sport-basketball{background:#fff3d6;color:#92400e}
.badge.sport-volleyball{background:#e8efff;color:#1d4ed8}
.badge.sport-futsal{background:#f1eaff;color:#6d28d9}

<script>
'use strict';
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const fmtDate=d=>{if(!d)return '—';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`};
const fmtNum=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(Number(n)||0);
const dateAdd=(date,days)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateRange=(start,end)=>{const out=[];for(let d=start;d<=end;d=dateAdd(d,1))out.push(d);return out};
const timeToMin=t=>{if(!/^\d{2}:\d{2}$/.test(t||''))return NaN;const [h,m]=t.split(':').map(Number);return h*60+m};
const durationHours=(a,b)=>(timeToMin(b)-timeToMin(a))/60;
const fmtStatus=s=>({"Solicitud recibida":"Solicitud recibida","Pre-reserva":"Pre-reserva","Confirmada":"Confirmada","Completada":"Completada","Cancelada":"Cancelada","No presentada":"No presentada"}[s]||s||'—');
const statusClass=s=>['Confirmada','Completada'].includes(s)?'green':['Pre-reserva','Solicitud recibida'].includes(s)?'amber':['Cancelada','No presentada','Anulado'].includes(s)?'red':'blue';
const INCOME_CATS=['Alquiler de pista','Cursos deportivos','Actividades dirigidas','Escuelas deportivas','Eventos','Abonos','Inscripciones','Subvenciones','Transferencias municipales','Otros ingresos'];
const EXPENSE_CATS=['Personal','Suministros','Electricidad','Agua','Gas','Limpieza','Mantenimiento','Material deportivo','Equipamiento','Seguros','Servicios externos','Reparaciones','Otros'];
const SPORTS=['Baloncesto','Voleibol','Fútbol sala','Balonmano'];
const RES_STATUSES=['Solicitud recibida','Pre-reserva','Confirmada','Completada','Cancelada','No presentada'];
const METHODS=['Efectivo','Tarjeta (terminal externo)','Transferencia','Domiciliación','Bizum','Otro'];
const NAV=[['inicio','Inicio','⌂'],['reservas','Calendario y reservas','▦'],['pista','Plano de pista','▤'],['instalaciones','Instalaciones','▥'],['tarifas','Tarifas y precios','€'],['ingresos','Ingresos','↗'],['gastos','Gastos','↘'],['impuestos','Impuestos y beneficio neto','％'],['facturacion','Facturación y cobros','▣'],['presupuestos','Presupuestos','▥'],['tesoreria','Tesorería','◫'],['proveedores','Proveedores','♧'],['mantenimiento','Mantenimiento','⚒'],['bloqueos','Bloqueos y festivos','▧'],['informes','Informes','▤'],['configuracion','Configuración','⚙'],['copias','Copias de seguridad','⬡']];
const initialState=()=>({version:3,createdAt:new Date().toISOString(),reservations:[],entries:[],payments:[],budgets:[],providers:[],maintenance:[],closures:[],rates:{'Baloncesto':12,'Voleibol':12,'Fútbol sala':30,'Balonmano':30},taxSettings:{management:'',entityType:'',regime:'',profitTaxType:'',profitTaxRate:'',otherCharges:0,source:'',observations:'',rates:[]},settings:{centerName:'Polideportivo municipal',municipality:'',address:'',phone:'',email:'',owner:'',management:'',currency:'EUR',timezone:'Europe/Madrid',openingHours:'',cancellationPolicy:''},audit:[]});
let state=initialState(),storageMode='loading',currentPage='inicio',calendarDate=today(),calendarView='week',planDate=today(),planTime='17:00',entryFilter='all',reservationSearch='',reservationSport='all',reservationStatus='all';

class LocalStore{
  constructor(){this.db=null;this.mode='volatile'}
  async init(){
    let idbError=null;let idbHasSavedState=false;
    if('indexedDB' in window){
      try{
        this.db=await new Promise((resolve,reject)=>{const req=indexedDB.open('PoliGestionDB',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('app'))db.createObjectStore('app')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('No se pudo abrir IndexedDB'));req.onblocked=()=>reject(new Error('La base de datos está bloqueada'))});
        let saved=await this.idbGet();
        if(saved){idbHasSavedState=true;this.mode='indexedDB';return this.validateAndReturn(saved)}
        const ls=this.readLocal();if(ls){await this.idbSet(ls);const verify=await this.idbGet();if(!verify)throw new Error('No se verificó la inicialización');this.mode='indexedDB';return this.validateAndReturn(verify)}
        const fresh=initialState();await this.idbSet(fresh);const verify=await this.idbGet();if(!verify)throw new Error('No se verificó la inicialización');this.mode='indexedDB';return this.validateAndReturn(verify);
      }catch(e){idbError=e;try{if(this.db)this.db.close()}catch{}this.db=null;if(idbHasSavedState)throw new Error(`La base de datos IndexedDB contiene datos existentes que no han superado la validación. No se han sobrescrito. ${e.message}`)}
    }
    try{const saved=this.readLocal();if(saved){this.mode='localStorage';return this.validateAndReturn(saved)}const fresh=initialState();localStorage.setItem('poligestion_state_v3',JSON.stringify(fresh));const check=JSON.parse(localStorage.getItem('poligestion_state_v3'));this.mode='localStorage';return this.validateAndReturn(check)}catch(e){this.mode='volatile';throw new Error(`No ha sido posible inicializar un almacenamiento persistente.${idbError?` IndexedDB: ${idbError.message}.`:''} LocalStorage: ${e.message}`)}
  }

function taxNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function taxRateFor(entry){return taxNum(entry.taxRate)}
function incomeTaxParts(e){
 const treatment=e.taxTreatment||'unconfigured';
 if(treatment!=='taxable')return {base:taxNum(e.amount),tax:0,total:taxNum(e.amount),treatment};
 const rate=taxRateFor(e);if(!rate)return {base:taxNum(e.amount),tax:0,total:taxNum(e.amount),treatment:'missing'};
 if(e.taxIncluded){const base=taxNum(e.amount)/(1+rate/100);return {base,tax:taxNum(e.amount)-base,total:taxNum(e.amount),treatment}}
 const base=taxNum(e.taxBase??e.amount),tax=base*rate/100;return {base,tax,total:base+tax,treatment};
}
function expenseTaxParts(e){

}

function openPaymentModal(entryId){const entry=state.entries.find(e=>e.id===entryId);if(!entry)return;const type=entry.type==='income'?'cobro':'pago';const refundable=state.payments.filter(p=>p.entryId===entryId&&p.type==='cobro').reduce((a,p)=>a+Number(p.amount),0)-state.payments.filter(p=>p.entryId===entryId&&p.type==='devolucion').reduce((a,p)=>a+Number(p.amount),0);const isRefundOnly=entry.status==='Anulado';const pending=isRefundOnly?Math.max(0,refundable):amountPending(entry);if(isRefundOnly&&(entry.type!=='income'||pending<=0.0001)){toast('Este registro anulado no tiene cobros pendientes de devolución.','warn');return}const body=`<form id="modalForm"><div class="callout"><strong>${esc(entry.concept)}</strong><br>Importe total: ${money(entry.amount)} · Saldo pendiente: <strong>${money(pending)}</strong></div><div class="form-grid" style="margin-top:14px">${selectField('Tipo de movimiento','paymentType',isRefundOnly?['devolucion']:entry.type==='income'?['cobro','devolucion']:['pago'],isRefundOnly?'devolucion':type)}${field('Importe (€) *','amount',pending.toFixed(2),'number','min="0.01" step="0.01" required')}${field('Fecha *','date',today(),'date')}${selectField('Método','method',METHODS,'Efectivo')}${field('Referencia','reference','','text')}${textareaField('Observaciones','notes','')}</div><div class="callout warning" style="margin-top:12px">No se almacenan datos completos de tarjetas bancarias. El método “Tarjeta” indica un cobro realizado en un terminal externo.</div></form>`;openModal(isRefundOnly?'Registrar devolución':type==='cobro'?'Registrar cobro':type==='pago'?'Registrar pago':'Registrar devolución',body,{footer:modalFooter()});$('#modalForm').addEventListener('submit',async ev=>{ev.preventDefault();const x=formValues(ev.currentTarget),amount=Number(x.amount);if(!Number.isFinite(amount)||amount<=0||!x.date){toast('Introduce un importe y una fecha válidos.','error');return}try{await commit(type==='cobro'?'Registrar cobro':type==='pago'?'Registrar pago':'Registrar devolución',entry.concept,s=>{const current=s.entries.find(e=>e.id===entryId);if(current.status==='Anulado'&&x.paymentType!=='devolucion')throw new Error('El movimiento está anulado; solo se permiten devoluciones de cobros previos.');const net=moneyPaid(current,s);if(x.paymentType==='devolucion'){const refundable=s.payments.filter(p=>p.entryId===entryId&&p.type==='cobro').reduce((a,p)=>a+Number(p.amount),0)-s.payments.filter(p=>p.entryId===entryId&&p.type==='devolucion').reduce((a,p)=>a+Number(p.amount),0);if(amount>refundable+0.0001)throw new Error(`La devolución supera los cobros netos (${money(refundable)}).`)}else{const available=Number(current.amount)-net;if(amount>available+0.0001)throw new Error(`El importe supera el saldo pendiente (${money(Math.max(0,available))}). No se permiten cobros o pagos superiores al saldo.`)}s.payments.push({id:uid(),entryId,type:x.paymentType,date:x.date,amount,method:x.method,reference:x.reference.trim(),notes:x.notes.trim(),createdAt:new Date().toISOString()})});closeModal()}catch(err){saveError(err)}})}

function openMaintenanceModal(id=null){const old=id?state.maintenance.find(m=>m.id===id):null;const v=old||{title:'',description:'',startDate:today(),endDate:today(),start:'00:00',end:'23:59',zoneId:'all',responsible:'',cost:0,status:'Abierta',notes:''};const body=`<form id="modalForm"><div class="form-grid">${field('Título *','title',v.title)}${selectField('Instalación afectada','zoneId',[{value:'all',label:'Toda la pista'},'Zona 1','Zona 2','Zona 3'],v.zoneId||'all')}${field('Fecha de inicio *','startDate',v.startDate,'date')}${field('Fecha de finalización *','endDate',v.endDate,'date')}${field('Hora de inicio','start',v.start||'00:00','time')}${field('Hora de finalización','end',v.end||'23:59','time')}${field('Responsable o proveedor','responsible',v.responsible)}${field('Coste (€)','cost',v.cost,'number','min="0" step="0.01"')}${selectField('Estado','status',['Abierta','En curso','Finalizada'],v.status)}${textareaField('Descripción','description',v.description)}${textareaField('Observaciones','notes',v.notes)}</div></form>`;openModal(old?'Editar incidencia':'Nueva incidencia de mantenimiento',body,{wide:true,footer:modalFooter()});$('#modalForm').addEventListener('submit',async e=>{e.preventDefault();const x=formValues(e.currentTarget);if(!x.title.trim()||!x.startDate||!x.endDate||x.endDate<x.startDate){toast('Completa el título y un periodo válido.','error');return}if(timeToMin(x.start)>=timeToMin(x.end)){toast('La hora final debe ser posterior a la inicial.','error');return}const candidate={...x,cost:Number(x.cost)||0};if(candidate.status!=='Finalizada'){const affected=state.reservations.filter(r=>reservationBlocks(r)&&r.date>=x.startDate&&r.date<=x.endDate&&overlap(x.start||'00:00',x.end||'23:59',r.start,r.end)&&areasOverlap(x.zoneId,r.sport==='Fútbol sala'||r.sport==='Balonmano'?'all':r.zoneId));if(affected.length&&!confirmAction(`La incidencia afecta a ${affected.length} reserva(s) activa(s). Se conservarán y se marcará el posible conflicto, pero las nuevas function buildReport(start,end,sport='all',type='all'){const entries=state.entries.filter(e=>e.date>=start&&e.date<=end&&e.status!=='Anulado'&&(type==='all'||e.type===type));const res=state.reservations.filter(r=>r.date>=start&&r.date<=end&&(sport==='all'||r.sport===sport));const income=entries.filter(e=>e.type==='income').reduce((a,e)=>a+Number(e.amount),0),expense=entries.filter(e=>e.type==='expense').reduce((a,e)=>a+Number(e.amount),0);const paid=state.payments.filter(p=>p.date>=start&&p.date<=end);const cashIn=paid.filter(p=>p.type==='cobro').reduce((a,p)=>a+Number(p.amount),0)-paid.filter(p=>p.type==='devolucion').reduce((a,p)=>a+Number(p.amount),0),cashOut=paid.filter(p=>p.type==='pago').reduce((a,p)=>a+Number(p.amount),0);const active=res.filter(r=>!['Cancelada','No presentada'].includes(r.status));const hours=active.reduce((a,r)=>a+durationHours(r.start,r.end)*(isFullSport(r.sport)?3:1),0);const bySport=SPORTS.filter(s=>sport==='all'||sport===s).map(s=>({s,n:res.filter(r=>r.sport===s).length,hrs:res.filter(r=>r.sport===s&&!['Cancelada','No presentada'].includes(r.status)).reduce((a,r)=>a+durationHours(r.start,r.end),0)}));return `<div class="grid four-col kpi-grid">${kpi('Ingresos registrados',money(income),'Durante el periodo')}${kpi('Gastos registrados',money(expense),'Durante el periodo','#a96a26')}${kpi('Resultado económico',money(income-expense),'Ingresos − gastos','#16845b')}${kpi('Horas-zona ocupadas',fmtNum(hours),'Cómputo de zonas parciales y pista completa','#2b7790')}</div><div class="grid two-col"><div class="card"><h3 class="section-title">Resumen de actividad</h3><div class="mini-stat"><span>Reservas en periodo</span><strong>${res.length}</strong></div><div class="mini-stat"><span>Reservas activas / realizadas</span><strong>${active.length}</strong></div><div class="mini-stat"><span>Canceladas</span><strong>${res.filter(r=>r.status==='Cancelada').length}</strong></div><div class="mini-stat"><span>No presentadas</span><strong>${res.filter(r=>r.status==='No presentada').length}</strong></div><div class="mini-stat"><span>Cobros netos registrados</span><strong>${money(cashIn)}</strong></div><div class="mini-stat"><span>Pagos registrados</span><strong>${money(cashOut)}</strong></div></div><div class="card"><h3 class="section-title">Reservas por modalidad</h3>${bySport.map(x=>`<div class="mini-stat"><span>${esc(x.s)}</span><strong>${x.n} · ${fmtNum(x.hrs)} h</strong></div>`).join('')}<div class="footer-note">La ocupación se calcula multiplicando la duración por el número de zonas ocupadas; una reserva de pista completa equivale a tres zonas.</div></div></div><div class="card" style="margin-top:15px"><h3 class="section-title">Movimientos económicos del periodo</h3>${table(['Fecha','Tipo','Concepto','Categoría','Importe','Liquidado','Pendiente'],entries.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.type==='income'?'Ingreso':'Gasto'}</td><td>${esc(e.concept)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${money(moneyPaid(e))}</td><td>${money(amountPending(e))}</td></tr>`).join(''),7)}</div>`}
function renderSettings(){const s=state.settings;return `${pageHead('Configuración','Datos generales del polideportivo y parámetros de gestión.')}<div class="card"><form id="settingsForm"><div class="section-title">Datos del centro</div><div class="form-grid">${field('Nombre del polideportivo','centerName',s.centerName)}${field('Municipio','municipality',s.municipality)}${field('Dirección','address',s.address)}${field('Teléfono de contacto','phone',s.phone,'tel')}${field('Correo electrónico','email',s.email,'email')}${field('Organismo titular','owner',s.owner)}${selectField('Modelo de gestión','management',[{value:'',label:'Seleccionar…'},'Gestión municipal directa','Gestión indirecta o concesión','Otro modelo'],s.management)}${selectField('Moneda','currency',[{value:'EUR',label:'Euro (€)'}],s.currency||'EUR')}${selectField('Zona horaria','timezone',[{value:'Europe/Madrid',label:'Europe/Madrid'}],s.timezone||'Europe/Madrid')}</div><div class="hr"></div><div class="section-title">Condiciones de funcionamiento</div><div class="form-grid">${textareaField('Horario general','openingHours',s.openingHours)}${textareaField('Política de cancelación','cancellationPolicy',s.cancellationPolicy)}</div><div style="margin-top:15px"><button class="btn primary" type="submit">Guardar configuración</button></div></form></div><div class="callout" style="margin-top:15px">El modelo de gestión no se presupone. Esta configuración es informativa y no genera permisos de acceso, integración bancaria ni facturación fiscal oficial.</div>`}
function renderBackups(){let last='No se ha generado ninguna copia en esta sesión.';try{const m=localStorage.getItem('poligestion_last_backup');if(m)last=new Date(m).toLocaleString('es-ES')}catch{}const size=new Blob([JSON.stringify(state)]).size;return `${pageHead('Copias de seguridad','Exporta y restaura los registros completos para evitar pérdidas de información.')}<div class="grid two-col"><div class="card"><div class="notice-card"><div class="notice-icon">↓</div><div><h3 class="section-title" style="margin-bottom:5px">Crear copia de seguridad</h3><p class="small-text muted">Descarga un archivo JSON que incluye reservas, movimientos económicos, cobros, presupuestos, proveedores, mantenimiento, cierres, configuración y auditoría.</p></div></div><div class="mini-stat"><span>Tamaño aproximado</span><strong>${(size/1024).toFixed(1)} KB</strong></div><div class="mini-stat"><span>Última copia descargada</span><strong>${esc(last)}</strong></div><div style="margin-top:15px"><button class="btn primary" data-action="backup-export">Descargar copia JSON</button></div></div><div class="card"><div class="notice-card"><div class="notice-icon">↑</div><div><h3 class="section-title" style="margin-bottom:5px">Restaurar una copia</h3><p class="small-text muted">Valida la estructura antes de sustituir los datos y guarda primero una copia previa del estado actual.</p></div></div><div class="field" style="margin-top:12px"><label for="backupFile">Archivo de copia JSON</label><input id="backupFile" type="file" accept="application/json,.json"></div><div style="margin-top:15px"><button class="btn danger" data-action="backup-import">Validar y restaurar copia</button></div></div></div><div class="callout warning" style="margin-top:15px">Las copias descargadas contienen nombres, teléfonos y movimientos económicos. Guárdalas en una ubicación protegida y limita su acceso. La copia descargada no se sube a ningún servidor.</div><div class="card" style="margin-top:15px"><h3 class="section-title">Integridad y limitaciones</h3><div class="mini-stat"><span>Colecciones registradas</span><strong>8</strong></div><div class="mini-stat"><span>Modo de almacenamiento actual</span><strong>${storageMode==='indexedDB'?'IndexedDB':storageMode==='localStorage'?'LocalStorage':'No disponible'}</strong></div><p class="small-text muted">El almacenamiento es local a este navegador y perfil. No sincroniza datos entre ordenadores, perfiles o dispositivos. El archivo HTML autónomo no incorpora autenticación segura de servidor ni copias automáticas externas.</p></div>`}
function csvSafe(v){let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`}
function downloadFile(filename,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function toCSV(headers,rows){return '\ufeff'+[headers,...rows].map(row=>row.map(csvSafe).join(';')).join('\r\n')}
function exportEntries(type){const list=state.entries.filter(e=>e.type===type);const rows=list.map(e=>[e.date,e.concept,e.category,e.amount,e.taxes||0,moneyPaid(e),amountPending(e),entryStatus(e),e.providerId,e.notes]);downloadFile(`PoliGestion_${type==='income'?'Ingresos':'Gastos'}_${today()}.csv`,toCSV(['Fecha','Concepto','Categoría','Importe total','Impuestos incluidos','Cobrado/pagado','Pendiente','Estado','Proveedor ID','Observaciones'],rows),'text/csv;charset=utf-8')}
function exportPayments(){const rows=state.payments.map(p=>{const e=state.entries.find(x=>x.id===p.entryId);return [p.date,p.type,e?.concept||'',p.amount,p.method,p.reference,p.notes]});downloadFile(`PoliGestion_Tesoreria_${today()}.csv`,toCSV(['Fecha','Tipo','Concepto','Importe','Método','Referencia','Observaciones'],rows),'text/csv;charset=utf-8')}
function exportReport(){const start=$('#reportStart')?.value||today().slice(0,4)+'-01-01',end=$('#reportEnd')?.value||today(),sport=$('#reportSport')?.value||'all',type=$('#reportType')?.value||'all';const entries=state.entries.filter(e=>e.date>=start&&e.date<=end&&e.status!=='Anulado'&&(type==='all'||e.type===type));const rows=entries.map(e=>[e.date,e.type,e.concept,e.category,e.amount,moneyPaid(e),amountPending(e)]);const res=state.reservations.filter(r=>r.date>=start&&r.date<=end&&(sport==='all'||r.sport===sport));rows.push(...res.map(r=>[r.date,'reserva',`${r.sport} · ${r.contactName}`,occupancyLabel(r),r.price,'','']));downloadFile(`PoliGestion_Informe_${start}_${end}.csv`,toCSV(['Fecha','Tipo','Concepto','Categoría / ocupación','Importe','Liquidado','Pendiente'],rows),'text/csv;charset=utf-8')}
function validateBackup(obj){const required=['reservations','entries','payments','budgets','providers','maintenance','closures','audit'];if(!obj||typeof obj!=='object'||Array.isArray(obj))throw new Error('El archivo no contiene un objeto de copia válido.');for(const key of required)if(!Array.isArray(obj[key]))throw new Error(`Falta la colección «${key}» o no tiene formato de lista.`);if(!obj.settings||typeof obj.settings!=='object'||!obj.rates||typeof obj.rates!=='object')throw new Error('Faltan la configuración o las tarifas.');for(const r of obj.reservations){if(!r.id||!r.contactName||!SPORTS.includes(r.sport)||!r.date||!r.start||!r.end||!Number.isFinite(Number(r.price)))throw new Error('La copia contiene una reserva con campos obligatorios incorrectos.')}for(const e of obj.entries){if(!e.id||!['income','expense'].includes(e.type)||!e.date||!Number.isFinite(Number(e.amount)))throw new Error('La copia contiene un movimiento económico no válido.')}for(const p of obj.payments){if(!p.id||!p.entryId||!['cobro','pago','devolucion'].includes(p.type)||!Number.isFinite(Number(p.amount)))throw new Error('La copia contiene un movimiento de tesorería no válido.');if(!obj.entries.some(e=>e.id===p.entryId))throw new Error('Hay un cobro o pago que no está vinculado a un movimiento existente.')}return obj}
async function exportBackup(){const content=JSON.stringify(state,null,2);downloadFile(`PoliGestion_Copia_${today()}.json`,content,'application/json;charset=utf-8');try{localStorage.setItem('poligestion_last_backup',new Date().toISOString())}catch{}toast('Copia JSON preparada para descargar. Comprueba que el archivo se ha descargado.')}
async function importBackup(){const file=$('#backupFile')?.files?.[0];if(!file){toast('Selecciona primero un archivo JSON.','error');return}if(!confirmAction('La restauración sustituirá los datos actuales. Se intentará guardar una copia previa antes de continuar. ¿Deseas continuar?'))return;try{const textContent=await file.text();const parsed=validateBackup(JSON.parse(textContent));const previous=JSON.stringify(state);try{localStorage.setItem('poligestion_pre_restore_backup',previous);if(localStorage.getItem('poligestion_pre_restore_backup')!==previous)throw new Error('No se pudo verificar la copia previa')}catch(e){throw new Error(`Restauración cancelada: no se pudo crear una copia previa verificable (${e.message}).`)}const draft=clone(parsed);draft.audit.unshift({id:uid(),at:new Date().toISOString(),action:'Restaurar copia',detail:`Archivo: ${file.name}`});const mode=await store.save(draft);state=draft;storageMode=mode;updateStorageUI();render();toast('Copia restaurada y guardado verificado.');}catch(e){saveError(e)}}
function entryRowsFiltered(type){const term=($('#entrySearch')?.value||'').toLowerCase(),status=$('#entryStatusFilter')?.value||'all',cat=$('#entryCategoryFilter')?.value||'all';const list=state.entries.filter(e=>e.type===type).filter(e=>(!term||`${e.concept} ${e.category} ${e.notes||''}`.toLowerCase().includes(term))&&(status==='all'||entryStatus(e)===status)&&(cat==='all'||e.category===cat)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return table(['Fecha','Concepto','Categoría','Importe','Cobrado / pagado','Pendiente','Estado','Acciones'],list.map(e=>`<tr><td>${fmtDate(e.date)}</td><td><strong>${esc(e.concept)}</strong>${e.origin==='reservation'?'<div class="small-text muted">Generado desde reserva</div>':''}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${money(Math.max(0,moneyPaid(e)))}</td><td>${money(amountPending(e))}</td><td><span class="badge ${statusClass(entryStatus(e))}">${entryStatus(e)}</span></td><td><div class="inline-actions">${e.reservationId?`<button class="btn small" data-action="edit-reservation" data-id="${e.reservationId}">Reserva</button>`:`<button class="btn small" data-action="edit-entry" data-id="${e.id}">Editar</button>`}<button class="btn small" data-action="entry-payment" data-id="${e.id}">${e.status==='Anulado'?'Devolución':type==='income'?'Cobro':'Pago'}</button></div></td></tr>`),8)}
function providerRowsFiltered(){const term=($('#providerSearch')?.value||'').toLowerCase();const list=state.providers.filter(p=>`${p.name} ${p.taxId||''} ${p.phone||''} ${p.email||''}`.toLowerCase().includes(term)).sort((a,b)=>a.name.localeCompare(b.name));return table(['Nombre / razón social','Identificación fiscal','Teléfono','Correo','Gastos asociados','Pendiente de pago','Acciones'],list.map(p=>{const ex=state.entries.filter(e=>e.providerId===p.id);const pending=ex.filter(e=>e.type==='expense'&&e.status!=='Anulado').reduce((a,e)=>a+amountPending(e),0);return `<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.taxId||'—')}</td><td>${esc(p.phone||'—')}</td><td>${esc(p.email||'—')}</td><td>${ex.length}</td><td>${money(pending)}</td><td><div class="inline-actions"><button class="btn small" data-action="edit-provider" data-id="${p.id}">Editar</button><button class="btn small danger" data-action="delete-provider" data-id="${p.id}">Eliminar</button></div></td></tr>`}).join(''),7)}
async function cancelReservation(id){const r=state.reservations.find(x=>x.id===id);if(!r||['Cancelada','No presentada'].includes(r.status))return;if(!confirmAction(`¿Cancelar la reserva de ${r.contactName} (${r.sport}, ${fmtDate(r.date)})? Los cobros existentes se conservarán en el historial.`))return;try{await commit('Cancelar reserva',`${r.sport} · ${r.contactName}`,s=>{const item=s.reservations.find(x=>x.id===id);item.status='Cancelada';item.updatedAt=new Date().toISOString();updateReservationRevenue(s,item)})}catch(e){saveError(e)}}
function payReservation(id){const e=reservationEntry(state,id);if(!e){toast('Esta reserva todavía no genera un ingreso. Cambia su estado a Pre-reserva o Confirmada para activar el control de cobro.','warn');return}openPaymentModal(e.id)}
function goPage(page){if(!NAV.some(x=>x[0]===page))return;currentPage=page;$('#sidebar').classList.remove('open');render()}
function actionFor(target){const action=target.dataset.action,id=target.dataset.id;switch(action){
 case 'new-reservation':openReservationModal();break;
 case 'edit-reservation':openReservationModal(id);break;
 case 'duplicate-reservation':{const r=state.reservations.find(x=>x.id===id);if(r)openReservationModal(null,{...r,date:dateAdd(r.date,7),contactName:r.contactName,contactPhone:r.contactPhone,notes:r.notes,price:r.price});break}
 case 'delete-reservation':deleteReservation(id);break;
 case 'cancel-reservation':cancelReservation(id);break;
 case 'pay-reservation':payReservation(id);break;
 case 'entry-payment':openPaymentModal(id);break;
 case 'new-entry':openEntryModal(target.dataset.type||'income');break;
 case 'edit-entry':{const e=state.entries.find(x=>x.id===id);if(e)openEntryModal(e.type,id);break}
 case 'calendar-prev':calendarDate=dateAdd(calendarDate,calendarView==='day'?-1:calendarView==='week'?-7:-new Date(calendarDate+'T12:00:00').getDate());render();break;
 case 'calendar-next':calendarDate=dateAdd(calendarDate,calendarView==='day'?1:calendarView==='week'?7:32);if(calendarView==='month')calendarDate=calendarDate.slice(0,7)+'-01';render();break;
 case 'calendar-today':calendarDate=today();render();break;
 case 'plan-now':planDate=today();planTime=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());render();break;
 case 'zone-click':if(target.classList.contains('available'))openReservationModal(null,{date:planDate,start:planTime,end:timeToMin(planTime)<1380?`${String(Math.floor((timeToMin(planTime)+60)/60)).padStart(2,'0')}:${String((timeToMin(planTime)+60)%60).padStart(2,'0')}`:'23:59',zoneId:target.dataset.zone});break;
 case 'new-budget':openBudgetModal();break;
 case 'edit-budget':openBudgetModal(id);break;
 case 'delete-budget':{const b=state.budgets.find(x=>x.id===id);if(b&&confirmAction(`¿Eliminar la partida ${b.category} (${b.year})? Los movimientos no se borrarán.`))commit('Eliminar presupuesto',b.category,s=>{s.budgets=s.budgets.filter(x=>x.id!==id)}).catch(saveError);break}
 case 'new-provider':openProviderModal();break;
 case 'edit-provider':openProviderModal(id);break;
 case 'delete-provider':deleteProvider(id);break;
 case 'new-maintenance':openMaintenanceModal();break;
 case 'edit-maintenance':openMaintenanceModal(id);break;
 case 'delete-maintenance':deleteMaintenance(id);break;
 case 'new-closure':openClosureModal();break;
 case 'edit-closure':openClosureModal(id);break;
 case 'delete-closure':deleteClosure(id);break;
 case 'run-report':{const a=$('#reportStart').value,b=$('#reportEnd').value,s=$('#reportSport').value,t=$('#reportType').value;if(!a||!b||b<a){toast('El periodo del informe no es válido.','error');break}$('#reportPeriod').textContent=`Periodo: ${fmtDate(a)} – ${fmtDate(b)} · Modalidad: ${s==='all'?'Todas':s} · Tipo: ${t==='all'?'Todos':t==='income'?'Ingresos':'Gastos'}`;$('#reportResults').innerHTML=buildReport(a,b,s,t);break}
 case 'export-entries':exportEntries(target.dataset.type||'income');break;
 case 'export-payments':exportPayments();break;
 case 'export-report':exportReport();break;
 case 'print-report':window.print();break;
 case 'backup-export':exportBackup();break;
 case 'backup-import':importBackup();break;
 }
}

document.addEventListener('click',e=>{
 const page=e.target.closest('[data-page]');if(page){goPage(page.dataset.page);return}
 const act=e.target.closest('[data-action]');if(act){actionFor(act);return}
 if(e.target.closest('[data-close]')){closeModal();return}
 if(e.target.matches('[data-backdrop]'))closeModal();
});
document.addEventListener('change',e=>{
 if(['taxStart','taxEnd'].includes(e.target.id)){render();return}
 if(e.target.id==='calendarDate'){calendarDate=e.target.value||today();render()}
 if(e.target.id==='calendarView'){calendarView=e.target.value;render()}
 if(e.target.id==='resSport'){reservationSport=e.target.value;render()}
 if(e.target.id==='resStatus'){reservationStatus=e.target.value;render()}
 if(e.target.id==='planDate'){planDate=e.target.value||today();render()}
 if(e.target.id==='planTime'){planTime=e.target.value||'17:00';render()}
 if(['entryStatusFilter','entryCategoryFilter'].includes(e.target.id)){const type=currentPage==='gastos'?'expense':'income';$('#entryTable').innerHTML=entryRowsFiltered(type)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='resSearch'){reservationSearch=e.target.value;const pos=e.target.selectionStart;render();const i=$('#resSearch');i?.focus();i?.setSelectionRange(pos,pos)}
 if(e.target.id==='entrySearch'){const type=currentPage==='gastos'?'expense':'income';$('#entryTable').innerHTML=entryRowsFiltered(type)}
 if(e.target.id==='providerSearch')$('#providerTable').innerHTML=providerRowsFiltered();
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='ratesForm'){e.preventDefault();const x=formValues(e.target);for(const s of SPORTS){if(!Number.isFinite(Number(x[s]))||Number(x[s])<0){toast('Introduce importes válidos para todas las tarifas.','error');return}}try{await commit('Actualizar tarifas','Precios por modalidad',d=>{for(const s of SPORTS)d.rates[s]=Number(x[s])})}catch(err){saveError(err)}}
 if(e.target.id==='taxSettingsForm'){e.preventDefault();const x=formValues(e.target);const r=x.taxProfitRate.trim();if(r!==''&&(!Number.isFinite(Number(r))||Number(r)<0||Number(r)>100)){toast('Introduce un porcentaje válido entre 0 y 100.','error');return}if(!Number.isFinite(Number(x.taxOther))||Number(x.taxOther)<0){toast('Introduce un importe válido para otras cargas.','error');return}try{await commit('Actualizar configuración fiscal','Parámetros fiscales de gestión',d=>{d.taxSettings={...(d.taxSettings||{}),management:x.taxManagement,entityType:x.taxEntity,regime:x.taxRegime,profitTaxType:x.taxProfitType,profitTaxRate:r,otherCharges:Number(x.taxOther),source:x.taxSource,observations:x.taxObs}});render()}catch(err){saveError(err)}}
 if(e.target.id==='settingsForm'){e.preventDefault();const x=formValues(e.target);try{await commit('Actualizar configuración','Datos generales del centro',d=>{d.settings={...d.settings,...x}})}catch(err){saveError(err)}}
});
$('#hamb').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(async()=>{try{state=await store.init();state.taxSettings=state.taxSettings||{management:'',entityType:'',regime:'',profitTaxType:'',profitTaxRate:'',otherCharges:0,source:'',observations:'',rates:[]};storageMode=store.mode;updateStorageUI();render()}catch(e){storageMode='volatile';updateStorageUI();$('#content').innerHTML=`<div class="card"><h2>No se pudo inicializar el almacenamiento</h2><p>${esc(e.message)}</p><p class="small-text muted">No se han habilitado operaciones de escritura para evitar sobrescribir datos existentes. Abre el archivo desde un navegador compatible y revisa los permisos de almacenamiento.</p></div>`;toast(e.message,'error')}})();
</script>
<style>
@media print{body{background:#fff}.sidebar,.topbar,.page-head .actions,.toolbar,.btn{display:none!important}.app{display:block}.content{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid}.table-wrap{overflow:visible}table{min-width:0}th,td{font-size:9px;padding:6px}.kpi-value{font-size:18px}.modal-backdrop,.toast-stack{display:none!important}}
</style>
</body>
